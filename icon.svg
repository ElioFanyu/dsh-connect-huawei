<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DSH Connect Huawei">
  <defs>
    <linearGradient id="hw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#1b3fb8"/>
    </linearGradient>
    <linearGradient id="hw-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#hw-bg)"/>
  <g fill="url(#hw-mark)">
    <!-- Two stacked bars: the two upstream platforms (CodeArts / OfficeAce). -->
    <rect x="26" y="30" width="76" height="20" rx="10" opacity="0.95"/>
    <rect x="26" y="58" width="76" height="20" rx="10" opacity="0.75"/>
    <!-- A connector stem into one shared harness route. -->
    <rect x="58" y="86" width="12" height="18" rx="6" opacity="0.9"/>
  </g>
  <circle cx="98" cy="98" r="12" fill="#4ade80"/>
  <path d="M92.5 98.2l3.6 3.6 7-7.4" fill="none" stroke="#0b2a12" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
